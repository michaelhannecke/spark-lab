<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="DejaVu Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="1240" height="880" fill="#fcfcfb"/>

  <!-- title -->
  <text x="48" y="56" font-size="27" font-weight="700" fill="#0b0b0b">Where the files actually live</text>
  <text x="48" y="84" font-size="15.5" fill="#52514e">Two isolation boundaries, four storage classes. Only one class is meant to survive everything.</text>

  <!-- ===================== HOST PANEL ===================== -->
  <rect x="48" y="116" width="530" height="562" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="48" y="116" width="530" height="42" rx="10" fill="#f0efec"/>
  <rect x="48" y="146" width="530" height="12" fill="#f0efec"/>
  <text x="70" y="144" font-size="15.5" font-weight="700" fill="#0b0b0b">DGX Spark host &#183; DGX OS</text>

  <!-- untouchable -->
  <rect x="70" y="180" width="486" height="86" rx="8" fill="#e9f6f0" stroke="#1baf7a" stroke-width="2"/>
  <text x="90" y="207" font-size="14.5" font-weight="700" fill="#0b0b0b">Driver stack &#183; CUDA 13 &#183; sm_121 &#183; system dist-packages</text>
  <text x="90" y="230" font-size="12.5" fill="#52514e" font-family="DejaVu Sans Mono, monospace">/usr/lib &#183; /usr/local/cuda &#183; python3/dist-packages</text>
  <text x="90" y="253" font-size="13" font-weight="700" fill="#1baf7a">NEVER WRITTEN TO. That is the entire point.</text>

  <!-- repo -->
  <rect x="70" y="286" width="486" height="96" rx="8" fill="#eef4fd" stroke="#2a78d6" stroke-width="2"/>
  <text x="90" y="312" font-size="14.5" font-weight="700" fill="#0b0b0b">The stack definition &#8212; version-controlled</text>
  <text x="90" y="336" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">~/spark-lab/{Dockerfile, docker-compose.yml, bin/, .env}</text>
  <text x="90" y="360" font-size="13" fill="#52514e">Rebuildable from git on either node. Losing it costs a clone.</text>

  <!-- notebooks -->
  <rect x="70" y="402" width="486" height="96" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/>
  <text x="90" y="428" font-size="14.5" font-weight="700" fill="#0b0b0b">Your actual work &#8212; the only irreplaceable class</text>
  <text x="90" y="452" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">~/spark-lab/notebooks/</text>
  <text x="90" y="476" font-size="13" fill="#52514e">Bind-mounted. Lives on the host filesystem, edited in the browser.</text>

  <!-- docker volumes -->
  <rect x="70" y="518" width="486" height="136" rx="8" fill="#fbf3e0" stroke="#eda100" stroke-width="2"/>
  <text x="90" y="544" font-size="14.5" font-weight="700" fill="#0b0b0b">Docker named volumes &#8212; disposable but expensive to rebuild</text>
  <text x="90" y="568" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">/var/lib/docker/volumes/spark-lab_venvs/_data</text>
  <text x="90" y="589" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">/var/lib/docker/volumes/spark-lab_jupyter-data/_data</text>
  <text x="90" y="610" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">/var/lib/docker/volumes/spark-lab_jupyter-config/_data</text>
  <text x="90" y="631" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">/var/lib/docker/volumes/spark-lab_caches/_data</text>

  <!-- ===================== ARROWS ===================== -->
  <defs>
    <marker id="a-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#eb6834"/>
    </marker>
    <marker id="a-yellow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#eda100"/>
    </marker>
    <marker id="a-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#898781"/>
    </marker>
  </defs>

  <path d="M562 450 L 662 450" stroke="#eb6834" stroke-width="2.5" fill="none" marker-end="url(#a-orange)"/>
  <text x="566" y="440" font-size="11.5" font-weight="700" fill="#eb6834">bind</text>

  <path d="M562 586 L 610 586 L 610 520 L 662 520" stroke="#eda100" stroke-width="2.5" fill="none" marker-end="url(#a-yellow)"/>
  <path d="M562 586 L 610 586 L 610 586 L 662 586" stroke="#eda100" stroke-width="2.5" fill="none" marker-end="url(#a-yellow)"/>
  <path d="M562 586 L 610 586 L 610 652 L 662 652" stroke="#eda100" stroke-width="2.5" fill="none" marker-end="url(#a-yellow)"/>
  <text x="566" y="576" font-size="11.5" font-weight="700" fill="#eda100">volumes</text>

  <path d="M562 222 L 610 222 L 610 222 L 662 222" stroke="#898781" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-grey)"/>
  <text x="620" y="210" font-size="10.5" fill="#898781" text-anchor="middle">/dev/nvidia*</text>

  <!-- ===================== CONTAINER PANEL ===================== -->
  <rect x="662" y="116" width="530" height="562" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <rect x="662" y="116" width="530" height="42" rx="10" fill="#f0efec"/>
  <rect x="662" y="146" width="530" height="12" fill="#f0efec"/>
  <text x="684" y="144" font-size="15.5" font-weight="700" fill="#0b0b0b">Container &#183; spark-lab</text>

  <!-- image layer -->
  <rect x="684" y="180" width="486" height="86" rx="8" fill="#f4f4f2" stroke="#898781" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="704" y="207" font-size="14.5" font-weight="700" fill="#0b0b0b">Image layers &#8212; NGC pytorch:25.10-py3 (aarch64)</text>
  <text x="704" y="230" font-size="13" fill="#52514e" font-family="DejaVu Sans Mono, monospace">torch &#183; cuDNN &#183; NCCL &#183; JupyterLab &#183; uv</text>
  <text x="704" y="253" font-size="13" fill="#52514e">Rebuilt from the Dockerfile. Nothing here is precious.</text>

  <!-- writable layer -->
  <rect x="684" y="286" width="486" height="96" rx="8" fill="#f4f4f2" stroke="#898781" stroke-width="2"/>
  <text x="704" y="312" font-size="14.5" font-weight="700" fill="#0b0b0b">Container writable layer</text>
  <text x="704" y="336" font-size="13" fill="#52514e">Anything installed outside a venv or a volume lands here.</text>
  <text x="704" y="360" font-size="13" fill="#52514e">Survives reboots. Dies on <tspan font-family="DejaVu Sans Mono, monospace">compose down</tspan>. Treat as scratch.</text>

  <!-- workspace -->
  <rect x="684" y="402" width="486" height="96" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="2.5"/>
  <text x="704" y="428" font-size="14.5" font-weight="700" fill="#0b0b0b">/workspace</text>
  <text x="704" y="452" font-size="13" fill="#52514e">JupyterLab root. Same inodes as the host directory.</text>
  <text x="704" y="476" font-size="13" fill="#52514e">Owned by UID 1000 so files don't come back root-owned.</text>

  <!-- mounted volumes -->
  <rect x="684" y="518" width="486" height="136" rx="8" fill="#fbf3e0" stroke="#eda100" stroke-width="2"/>
  <text x="704" y="544" font-size="13.5" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">/opt/venvs</text>
  <text x="880" y="544" font-size="12.5" fill="#52514e">per-project Python envs</text>
  <text x="704" y="571" font-size="13.5" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">/opt/jupyter-data</text>
  <text x="880" y="571" font-size="12.5" fill="#52514e">registered kernelspecs</text>
  <text x="704" y="598" font-size="13.5" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">/opt/jupyter-config</text>
  <text x="880" y="598" font-size="12.5" fill="#52514e">Lab UI layout &amp; settings</text>
  <text x="704" y="625" font-size="13.5" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">/opt/caches</text>
  <text x="880" y="625" font-size="12.5" fill="#52514e">pip &#183; uv &#183; HF_HOME &#183; torch.hub</text>
  <text x="704" y="648" font-size="12" fill="#898781">Model weights land here &#8212; not in the image, not in notebooks/.</text>

  <!-- ===================== SURVIVAL LEGEND ===================== -->
  <text x="48" y="722" font-size="16" font-weight="700" fill="#0b0b0b">What survives which teardown</text>

  <rect x="48" y="738" width="1144" height="1" fill="#e1e0d9"/>

  <text x="48" y="768" font-size="13" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">rmenv &lt;name&gt;</text>
  <text x="290" y="768" font-size="13" fill="#52514e">one project env + its kernel. Everything else untouched. Seconds.</text>

  <text x="48" y="800" font-size="13" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">compose down</text>
  <text x="290" y="800" font-size="13" fill="#52514e">writable layer only. Notebooks, envs, kernels and caches all survive.</text>

  <text x="48" y="832" font-size="13" font-weight="700" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">compose down -v</text>
  <text x="290" y="832" font-size="13" fill="#52514e">volumes too. Only <tspan font-weight="700" fill="#eb6834">notebooks/</tspan> and the git repo remain. This is the reset button.</text>

  <text x="48" y="864" font-size="13" font-weight="700" fill="#1baf7a" font-family="DejaVu Sans Mono, monospace">(nothing)</text>
  <text x="290" y="864" font-size="13" fill="#52514e">reaches DGX OS. No path in this diagram writes to the driver stack.</text>
</svg>
