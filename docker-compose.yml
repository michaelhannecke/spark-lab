name: spark-lab

services:
  lab:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.10-py3}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: spark-lab:local
    container_name: spark-lab
    hostname: spark-lab

    # Survives reboots and daemon restarts. Note this also means the container's
    # writable layer persists -- an ad-hoc `pip install` inside a *running*
    # container survives a reboot, and only dies on `compose down`/`up --build`.
    restart: unless-stopped
    init: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # If your Compose is older than v2.30 and the block above misbehaves,
    # replace it with:  runtime: nvidia

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
      # GB10 has unified LPDDR5X shared with the GPU. Keep allocator churn down
      # on long notebook sessions where you reload models repeatedly.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    ports:
      # BIND_ADDR=127.0.0.1 -> SSH-tunnel only (safest)
      # BIND_ADDR=0.0.0.0   -> reachable from the Mac Studio over the LAN
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8888}:8888"

    volumes:
      # Your actual notebooks + data live on the host. Everything else is
      # disposable container state.
      - ./notebooks:/workspace
      # Per-project venvs. Persist across rebuilds so you don't redo `newenv`.
      - venvs:/opt/venvs
      # Registered kernelspecs + JupyterLab UI state (layout, settings).
      - jupyter-data:/opt/jupyter-data
      - jupyter-config:/opt/jupyter-config
      # pip / uv / HuggingFace / torch.hub caches. Big, and worth keeping.
      - caches:/opt/caches
      # HF model cache, overlaid on top of the volume above (Docker sorts mounts
      # by path depth, so /opt/caches stays the volume and only .../hf is the
      # bind). A host directory means one copy of every checkpoint shared with
      # vLLM/TGI/any other HF-based container on this node, and it survives
      # `down -v`. The dir must exist and be owned by DEV_UID:DEV_GID BEFORE the
      # first `up` -- Docker creates a missing bind source as root:root, and the
      # container then can't write it. See HF_CACHE_DIR in .env.example.
      - ${HF_CACHE_DIR:-/srv/hf-cache}:/opt/caches/hf

    # DataLoader workers use /dev/shm. The 64 MB default will bite you.
    shm_size: "16gb"

    ulimits:
      memlock: -1
      stack: 67108864

    healthcheck:
      # GET /api is the only Jupyter endpoint marked @allow_unauthenticated.
      # /api/status is @web.authenticated -> 403 without a token -> permanently
      # "unhealthy". Use 127.0.0.1, not localhost: Jupyter binds IPv4 only and
      # localhost may resolve to ::1 first.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  venvs:
  jupyter-data:
  jupyter-config:
  caches:
